<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Lab · AI Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
    <div class="overlay" id="overlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="4"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg>
            Image<span>Lab</span>
        </div>
        <nav>
            <a href="#" data-page="home" class="active">
                <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1V10"/></svg>
                Generate
            </a>
            <a href="#" data-page="gallery">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                Gallery
            </a>
            <a href="#" data-page="settings">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Settings
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="theme-toggle dark" id="themeToggle">
                <span>🌙</span>
                <div class="pill"></div>
                <span>☀️</span>
            </div>
            <div class="footer-text">© 2025 Tuba Shakeel</div>
        </div>
    </aside>

    <div class="main">
        <button class="menu-toggle" id="menuToggle">
            <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            Menu
        </button>

        <div class="page active" id="page-home">
            <h2>✨ Generate</h2>
            <div class="generator-container">
                <div class="generator-left">
                    <div class="input-group">
                        <textarea id="promptInput" placeholder="Describe the image you want..." rows="3"></textarea>
                        <div class="controls">
                            <select id="styleSelect">
                                <option value="">Style</option>
                                <option value="realistic photo">Realistic</option>
                                <option value="anime style">Anime</option>
                                <option value="oil painting">Oil Painting</option>
                                <option value="cartoon style">Cartoon</option>
                                <option value="cyberpunk style">Cyberpunk</option>
                                <option value="watercolor painting">Watercolor</option>
                            </select>
                            <select id="ratioSelect">
                                <option value="1:1">Square</option>
                                <option value="3:4">Portrait</option>
                                <option value="4:3">Landscape</option>
                                <option value="16:9">Wide</option>
                                <option value="9:16">Tall</option>
                            </select>
                            <select id="sizeSelect">
                                <option value="1K">1K</option>
                                <option value="2K" selected>2K</option>
                                <option value="3K">3K</option>
                                <option value="4K">4K</option>
                            </select>
                        </div>
                    </div>
                    <div class="action-row">
                        <button class="btn btn-primary" id="generateBtn">
                            <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            Generate
                        </button>
                        <button class="btn" id="surpriseBtn">
                            <svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
                            Surprise
                        </button>
                    </div>
                    <div class="key-hint">⬆️⬇️ arrow keys to recall prompts</div>
                </div>
                <div class="chat-history" id="chatHistory">
                    <div class="empty-chat">No conversations yet. Generate your first image!</div>
                </div>
            </div>
        </div>

        <div class="page" id="page-gallery">
            <h2>🖼️ Gallery</h2>
            <div class="gallery-grid" id="galleryGrid"></div>
            <div class="gallery-pagination" id="galleryPagination">
                <button id="prevPageBtn" disabled>Previous</button>
                <span id="pageInfo">Page 1</span>
                <button id="nextPageBtn">Next</button>
            </div>
        </div>

        <div class="page" id="page-settings">
            <h2>⚙️ Settings</h2>
            <div class="settings-card">
                <div class="setting-row">
                    <span class="label">Theme</span>
                    <span class="value" id="themeLabel">Dark</span>
                </div>
                <div class="setting-row">
                    <span class="label">Total Images</span>
                    <span class="value" id="totalImages">0</span>
                </div>
                <div class="setting-row">
                    <span class="label">API Status</span>
                    <span class="value" id="apiStatus">● Connected</span>
                </div>
                <div class="setting-row">
                    <span class="label">Clear History</span>
                    <button id="clearHistoryBtn" class="danger-btn">Clear All</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const menuToggle = document.getElementById('menuToggle');
            const navLinks = document.querySelectorAll('.sidebar nav a');
            const pages = {
                home: document.getElementById('page-home'),
                gallery: document.getElementById('page-gallery'),
                settings: document.getElementById('page-settings')
            };
            const promptInput = document.getElementById('promptInput');
            const styleSelect = document.getElementById('styleSelect');
            const ratioSelect = document.getElementById('ratioSelect');
            const sizeSelect = document.getElementById('sizeSelect');
            const generateBtn = document.getElementById('generateBtn');
            const surpriseBtn = document.getElementById('surpriseBtn');
            const chatHistory = document.getElementById('chatHistory');
            const galleryGrid = document.getElementById('galleryGrid');
            const prevPageBtn = document.getElementById('prevPageBtn');
            const nextPageBtn = document.getElementById('nextPageBtn');
            const pageInfo = document.getElementById('pageInfo');
            const clearHistoryBtn = document.getElementById('clearHistoryBtn');
            const totalImages = document.getElementById('totalImages');
            const apiStatus = document.getElementById('apiStatus');
            const themeToggle = document.getElementById('themeToggle');
            const themeLabel = document.getElementById('themeLabel');
            const toastContainer = document.getElementById('toastContainer');

            const HISTORY_KEY = 'imageHistory';
            const ITEMS_PER_PAGE = 12;
            let currentPage = 1;
            let totalPages = 1;
            let isGenerating = false;
            let promptHistory = [];
            let historyIndex = -1;
            let messages = [];

            let isDark = localStorage.getItem('theme') !== 'light';
            applyTheme(isDark);

            function applyTheme(dark) {
                document.body.classList.toggle('light', !dark);
                themeToggle.classList.toggle('dark', dark);
                themeToggle.querySelector('span:first-child').textContent = dark ? '🌙' : '☀️';
                themeToggle.querySelector('span:last-child').textContent = dark ? '☀️' : '🌙';
                themeLabel.textContent = dark ? 'Dark' : 'Light';
                isDark = dark;
            }

            themeToggle.addEventListener('click', function() {
                applyTheme(!isDark);
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });

            function showToast(message, type) {
                type = type || 'success';
                var toast = document.createElement('div');
                toast.className = 'toast' + (type === 'error' ? ' error' : '');
                toast.textContent = message;
                toastContainer.appendChild(toast);
                requestAnimationFrame(function() {
                    toast.classList.add('show');
                });
                setTimeout(function() {
                    toast.classList.remove('show');
                    setTimeout(function() {
                        toast.remove();
                    }, 300);
                }, 3000);
            }

            function getHistory() {
                try {
                    var stored = localStorage.getItem(HISTORY_KEY);
                    return stored ? JSON.parse(stored) : [];
                } catch (e) {
                    return [];
                }
            }

            function saveHistory(history) {
                localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
                updateAll();
            }

            function addToHistory(imageUrl, prompt) {
                var history = getHistory();
                history.unshift({
                    id: Date.now(),
                    image: imageUrl,
                    prompt: prompt
                });
                if (history.length > 100) history.length = 100;
                saveHistory(history);
            }

            function deleteFromHistory(id) {
                var history = getHistory().filter(function(item) {
                    return item.id !== id;
                });
                saveHistory(history);
                messages = messages.filter(function(m) {
                    if (m.imageUrl) {
                        return history.some(function(h) {
                            return h.image === m.imageUrl;
                        });
                    }
                    return true;
                });
                renderChat();
            }

            function clearAllHistory() {
                if (confirm('Delete all images?')) {
                    localStorage.removeItem(HISTORY_KEY);
                    messages = [];
                    renderChat();
                    renderGallery();
                    updateBadges();
                    showToast('History cleared');
                }
            }

            function updateBadges() {
                var count = getHistory().length;
                totalImages.textContent = count;
            }

            function renderChat() {
                chatHistory.innerHTML = '';
                if (messages.length === 0) {
                    chatHistory.innerHTML = '<div class="empty-chat">No conversations yet. Generate your first image!</div>';
                    return;
                }
                messages.forEach(function(msg, idx) {
                    var div = document.createElement('div');
                    div.className = 'chat-message';
                    var p = document.createElement('div');
                    p.className = 'msg-prompt';
                    p.textContent = msg.type === 'user' ? '🧑 ' + msg.prompt : '🤖 ' + msg.prompt;
                    div.appendChild(p);
                    if (msg.imageUrl) {
                        var img = document.createElement('img');
                        img.className = 'msg-image';
                        img.src = msg.imageUrl;
                        img.alt = msg.prompt;
                        div.appendChild(img);
                        var actions = document.createElement('div');
                        actions.className = 'msg-actions';
                        var dl = document.createElement('a');
                        dl.href = msg.imageUrl;
                        dl.download = 'generated-image.png';
                        dl.innerHTML =
                            '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download';
                        actions.appendChild(dl);
                        var reuse = document.createElement('button');
                        reuse.innerHTML =
                            '<svg viewBox="0 0 24 24"><path d="M12 2v4M12 22v-4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M22 12h-4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Reuse';
                        reuse.addEventListener('click', function() {
                            promptInput.value = msg.prompt;
                            promptInput.focus();
                        });
                        actions.appendChild(reuse);
                        var regen = document.createElement('button');
                        regen.innerHTML =
                            '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9h-4m-9 9A9 9 0 0 1 3 12m9 9v-4m0-9H3m18 0h-4"/></svg> Regenerate';
                        regen.addEventListener('click', function() {
                            var original = msg.prompt.replace(
                                /, (realistic photo|anime style|oil painting|cartoon style|cyberpunk style|watercolor painting)$/,
                                '');
                            promptInput.value = original;
                            generateBtn.click();
                        });
                        actions.appendChild(regen);
                        var del = document.createElement('button');
                        del.innerHTML =
                            '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Remove';
                        del.addEventListener('click', function() {
                            var history = getHistory();
                            var hIdx = history.findIndex(function(h) {
                                return h.image === msg.imageUrl;
                            });
                            if (hIdx !== -1) {
                                history.splice(hIdx, 1);
                                saveHistory(history);
                            }
                            messages.splice(idx, 1);
                            renderChat();
                        });
                        actions.appendChild(del);
                        div.appendChild(actions);
                    }
                    chatHistory.appendChild(div);
                });
                chatHistory.scrollTop = chatHistory.scrollHeight;
                updateBadges();
            }

            function renderGallery() {
                var history = getHistory();
                totalPages = Math.ceil(history.length / ITEMS_PER_PAGE) || 1;
                if (currentPage > totalPages) currentPage = totalPages;
                var start = (currentPage - 1) * ITEMS_PER_PAGE;
                var end = start + ITEMS_PER_PAGE;
                var pageItems = history.slice(start, end);
                galleryGrid.innerHTML = '';
                if (pageItems.length === 0) {
                    galleryGrid.innerHTML =
                        '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:2rem;">No images found.</p>';
                } else {
                    pageItems.forEach(function(item) {
                        var div = document.createElement('div');
                        div.className = 'gallery-item';
                        var img = document.createElement('img');
                        img.src = item.image;
                        img.alt = item.prompt;
                        img.loading = 'lazy';
                        var del = document.createElement('button');
                        del.className = 'del-btn';
                        del.innerHTML =
                            '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
                        del.addEventListener('click', function(e) {
                            e.stopPropagation();
                            deleteFromHistory(item.id);
                        });
                        div.appendChild(img);
                        div.appendChild(del);
                        div.addEventListener('click', function() {
                            promptInput.value = item.prompt;
                            navigateTo('home');
                            showToast('Prompt loaded!');
                        });
                        galleryGrid.appendChild(div);
                    });
                }
                prevPageBtn.disabled = currentPage === 1;
                nextPageBtn.disabled = currentPage === totalPages;
                pageInfo.textContent = 'Page ' + currentPage + ' of ' + totalPages;
                updateBadges();
            }

            function navigateTo(page) {
                navLinks.forEach(function(link) {
                    link.classList.toggle('active', link.dataset.page === page);
                });
                Object.keys(pages).forEach(function(key) {
                    pages[key].classList.toggle('active', key === page);
                });
                closeSidebar();
                if (page === 'gallery') renderGallery();
                if (page === 'settings') updateBadges();
            }

            navLinks.forEach(function(link) {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    navigateTo(link.dataset.page);
                });
            });
