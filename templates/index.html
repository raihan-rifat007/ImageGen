<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080c">
<title>AI Image Studio</title>
<link rel="icon" type="image/png" href="/asset/Logo.png">
<link rel="apple-touch-icon" href="/asset/Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --violet-300:#c4b5fd;
  --violet-400:#a78bfa;
  --violet-500:#8b5cf6;
  --violet-600:#7c3aed;
  --fuchsia-400:#e879f9;
  --fuchsia-500:#d946ef;
  --emerald-500:#10b981;
  --red-500:#ef4444;
  --amber-500:#f59e0b;
  --bg:#08080c;
  --bg-1:#0d0d14;
  --bg-2:#13131c;
  --bg-3:#1a1a26;
  --bg-4:#22222f;
  --surface:rgba(255,255,255,.03);
  --surface-hover:rgba(255,255,255,.06);
  --surface-active:rgba(139,92,246,.12);
  --border:rgba(255,255,255,.07);
  --border-strong:rgba(255,255,255,.14);
  --border-accent:rgba(139,92,246,.35);
  --text:#f5f5f8;
  --text-2:#a5a5b8;
  --text-3:#6e6e85;
  --text-4:#4a4a5a;
  --accent:#8b5cf6;
  --accent-2:#d946ef;
  --accent-glow:rgba(139,92,246,.4);
  --accent-soft:rgba(139,92,246,.1);
  --gradient:linear-gradient(135deg,#8b5cf6 0%,#d946ef 100%);
  --gradient-subtle:linear-gradient(135deg,rgba(139,92,246,.15),rgba(217,70,239,.15));
  --radius-xs:6px;
  --radius-sm:10px;
  --radius:14px;
  --radius-lg:20px;
  --radius-xl:28px;
  --radius-full:999px;
  --shadow-xs:0 1px 2px rgba(0,0,0,.3);
  --shadow-sm:0 2px 8px rgba(0,0,0,.3);
  --shadow:0 8px 24px rgba(0,0,0,.4);
  --shadow-lg:0 20px 60px rgba(0,0,0,.5);
  --shadow-xl:0 40px 100px rgba(0,0,0,.6);
  --shadow-accent:0 8px 28px rgba(139,92,246,.35);
  --ease:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --topbar-h:64px;
  --sidebar-w:340px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
[data-theme="light"] {
  --bg:#fafafb;
  --bg-1:#ffffff;
  --bg-2:#f5f5f8;
  --bg-3:#eeeef3;
  --bg-4:#e4e4ec;
  --surface:rgba(0,0,0,.02);
  --surface-hover:rgba(0,0,0,.04);
  --surface-active:rgba(139,92,246,.08);
  --border:rgba(0,0,0,.07);
  --border-strong:rgba(0,0,0,.13);
  --border-accent:rgba(139,92,246,.35);
  --text:#0e0e16;
  --text-2:#5a5a6e;
  --text-3:#8a8a9a;
  --text-4:#b0b0be;
  --shadow-xs:0 1px 2px rgba(0,0,0,.05);
  --shadow-sm:0 2px 8px rgba(0,0,0,.06);
  --shadow:0 8px 24px rgba(0,0,0,.08);
  --shadow-lg:0 20px 60px rgba(0,0,0,.12);
  --shadow-xl:0 40px 100px rgba(0,0,0,.18);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;min-height:100dvh;
  font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  letter-spacing:-.01em;
  overflow-x:hidden;
  transition:background .3s var(--ease),color .3s var(--ease);
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 900px 600px at 15% -10%,rgba(139,92,246,.14),transparent 55%),
    radial-gradient(ellipse 700px 500px at 95% 0%,rgba(217,70,239,.09),transparent 55%);
  transition:opacity .3s var(--ease);
}
[data-theme="light"] body::before{opacity:.5}
button,input,textarea,select{font-family:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
::selection{background:var(--accent);color:#fff}
svg{flex-shrink:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:var(--radius-full);border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--bg-4);background-clip:padding-box}

.topbar{
  position:sticky;top:0;z-index:100;
  height:calc(var(--topbar-h) + var(--safe-t));
  padding-top:var(--safe-t);
  padding-left:max(16px,var(--safe-l));
  padding-right:max(16px,var(--safe-r));
  display:flex;align-items:center;gap:14px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border);
}
.brand{
  display:flex;align-items:center;gap:10px;
  text-decoration:none;color:inherit;flex-shrink:0;
  padding:4px 8px 4px 4px;border-radius:var(--radius-full);
  transition:background .15s var(--ease);
}
.brand:hover{background:var(--surface-hover)}
.brand-logo{
  width:32px;height:32px;border-radius:9px;
  object-fit:contain;
  background:var(--bg-2);
  padding:3px;
  box-shadow:var(--shadow-accent),inset 0 1px 0 rgba(255,255,255,.1);
  transition:transform .3s var(--ease-spring);
}
.brand:hover .brand-logo{transform:rotate(-8deg) scale(1.06)}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.02em;color:var(--text)}
.brand-name em{color:var(--accent);font-style:normal;font-weight:700}
.brand-tag{
  font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 8px;border-radius:var(--radius-full);
  background:var(--gradient-subtle);
  border:1px solid var(--border-accent);
  color:var(--fuchsia-400);
  margin-left:2px;
}
[data-theme="light"] .brand-tag{color:var(--violet-600)}
.cmd-trigger{
  flex:1;max-width:520px;margin:0 auto;
  height:38px;padding:0 12px 0 14px;
  display:flex;align-items:center;gap:10px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-full);
  color:var(--text-3);font-size:13px;font-weight:500;
  transition:all .15s var(--ease);
}
.cmd-trigger:hover{background:var(--surface-hover);border-color:var(--border-strong);color:var(--text-2)}
.cmd-trigger svg{width:15px;height:15px}
.cmd-trigger span{flex:1;text-align:left}
.cmd-trigger kbd{
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
  padding:2px 6px;border-radius:5px;
  background:var(--bg-2);border:1px solid var(--border);
  color:var(--text-3);
  display:inline-flex;gap:2px;align-items:center;
}
.cmd-trigger kbd kbd{background:none;border:none;padding:0;font-size:11px;color:inherit}
.topbar-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.icon-btn{
  width:38px;height:38px;border-radius:10px;
  display:grid;place-items:center;
  color:var(--text-2);background:transparent;
  transition:all .15s var(--ease);
  position:relative;
}
.icon-btn:hover{background:var(--surface-hover);color:var(--text)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:17px;height:17px}
.status-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:var(--radius-full);
  background:var(--surface);border:1px solid var(--border);
  font-size:11px;font-weight:600;color:var(--text-3);
  letter-spacing:.02em;
}
.status-pill .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--emerald-500);
  box-shadow:0 0 0 3px rgba(16,185,129,.18);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

.app{
  position:relative;z-index:1;
  display:grid;
  grid-template-columns:var(--sidebar-w) 1fr;
  min-height:calc(100vh - var(--topbar-h) - var(--safe-t));
  transition:grid-template-columns .35s var(--ease);
}
body[data-sidebar="collapsed"] .app{grid-template-columns:0 1fr}

.sidebar{
  border-right:1px solid var(--border);
  background:color-mix(in srgb,var(--bg-1) 60%,transparent);
  overflow:hidden;
  display:flex;flex-direction:column;
  position:relative;
  transition:opacity .3s var(--ease);
}
body[data-sidebar="collapsed"] .sidebar{opacity:0;pointer-events:none}
.sidebar-scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:20px 18px 100px;
}
.section{margin-bottom:18px}
.section-head{
  display:flex;align-items:center;gap:8px;
  padding:8px 4px;margin-bottom:8px;
  cursor:pointer;user-select:none;
  border-radius:8px;
  transition:background .15s var(--ease);
}
.section-head:hover{background:var(--surface)}
.section-head svg.ico{width:13px;height:13px;color:var(--accent)}
.section-head .label{
  flex:1;
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-3);
}
.section-head .chev{
  width:12px;height:12px;color:var(--text-4);
  transition:transform .25s var(--ease);
}
.section.collapsed .section-head .chev{transform:rotate(-90deg)}
.section-body{
  overflow:hidden;
  transition:max-height .35s var(--ease),opacity .25s var(--ease);
  max-height:2000px;opacity:1;
}
.section.collapsed .section-body{max-height:0;opacity:0}

.prompt-wrap{position:relative}
.prompt-area{
  width:100%;min-height:110px;resize:vertical;
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px 16px 32px;
  color:var(--text);font-size:13.5px;line-height:1.6;
  transition:all .2s var(--ease);
}
.prompt-area:focus{
  border-color:var(--border-accent);
  box-shadow:0 0 0 3px var(--accent-soft);
  background:var(--bg-3);
}
.prompt-area::placeholder{color:var(--text-4)}
.char-count{
  position:absolute;bottom:9px;right:12px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;font-weight:600;
  color:var(--text-4);pointer-events:none;
}
.char-count.warn{color:var(--amber-500)}
.prompt-actions{
  position:absolute;bottom:8px;left:10px;
  display:flex;gap:4px;
}
.pa-btn{
  width:24px;height:24px;border-radius:6px;
  display:grid;place-items:center;
  color:var(--text-4);background:transparent;
  transition:all .15s var(--ease);
}
.pa-btn:hover{background:var(--surface-hover);color:var(--text)}
.pa-btn svg{width:12px;height:12px}
.suggestions{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.suggest-chip{
  padding:5px 10px;border-radius:var(--radius-full);
  font-size:11px;font-weight:500;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-3);
  transition:all .15s var(--ease);
}
.suggest-chip:hover{border-color:var(--border-accent);color:var(--accent);background:var(--surface-active)}
textarea.neg{
  width:100%;min-height:48px;resize:vertical;
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:10px 14px;
  color:var(--text-2);font-size:12.5px;line-height:1.55;
  transition:all .2s var(--ease);
}
textarea.neg:focus{border-color:var(--border-accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.neg::placeholder{color:var(--text-4)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  padding:6px 11px;border-radius:var(--radius-full);
  background:var(--bg-2);border:1px solid var(--border);
  color:var(--text-2);font-size:11.5px;font-weight:500;
  transition:all .15s var(--ease);
}
.chip:hover{border-color:var(--border-strong);color:var(--text);background:var(--bg-3)}
.chip.active{
  background:var(--surface-active);
  border-color:var(--border-accent);
  color:var(--accent);
  box-shadow:0 0 0 1px var(--border-accent);
}
.models{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.model{
  padding:10px 11px;border-radius:var(--radius-sm);
  background:var(--bg-2);border:1px solid var(--border);
  text-align:left;color:var(--text-2);
  transition:all .15s var(--ease);
  position:relative;overflow:hidden;
}
.model:hover{border-color:var(--border-strong);color:var(--text);background:var(--bg-3)}
.model.active{
  background:var(--surface-active);
  border-color:var(--border-accent);
  color:var(--text);
  box-shadow:0 0 0 1px var(--border-accent);
}
.model-name{display:block;font-size:12.5px;font-weight:700;margin-bottom:2px}
.model-desc{display:block;font-size:10.5px;color:var(--text-3);line-height:1.3}
.model.active .model-desc{color:var(--violet-300)}
[data-theme="light"] .model.active .model-desc{color:var(--violet-600)}
.model-badge{
  display:inline-block;margin-top:5px;
  font-family:'JetBrains Mono',monospace;
  font-size:9px;font-weight:700;letter-spacing:.06em;
  padding:2px 6px;border-radius:4px;
  background:var(--gradient-subtle);
  color:var(--violet-300);
  text-transform:uppercase;
}
[data-theme="light"] .model-badge{color:var(--violet-600)}
.ratios{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ratio{
  padding:10px 6px;border-radius:var(--radius-sm);
  background:var(--bg-2);border:1px solid var(--border);
  color:var(--text-2);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:all .15s var(--ease);
}
.ratio:hover{border-color:var(--border-strong);color:var(--text);background:var(--bg-3)}
.ratio.active{
  background:var(--surface-active);
  border-color:var(--border-accent);
  color:var(--accent);
}
.ratio-preview{
  border:1.5px solid currentColor;border-radius:3px;
  opacity:.5;transition:opacity .2s var(--ease);
}
.ratio.active .ratio-preview{opacity:1}
.ratio span{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;font-weight:600;letter-spacing:.02em;
}
.adv-grid{display:flex;flex-direction:column;gap:14px}
.slider-row{display:flex;flex-direction:column;gap:6px}
.slider-head{display:flex;justify-content:space-between;align-items:center}
.slider-name{font-size:12px;font-weight:600;color:var(--text-2)}
.slider-val{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;font-weight:600;
  color:var(--accent);
  padding:2px 7px;border-radius:5px;
  background:var(--surface-active);
}
input[type=range]{
  width:100%;height:4px;border-radius:var(--radius-full);
  background:linear-gradient(to right,
    var(--accent) 0%,var(--accent) var(--val,50%),
    var(--bg-3) var(--val,50%),var(--bg-3) 100%);
  -webkit-appearance:none;appearance:none;
  outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  width:14px;height:14px;border-radius:50%;
  background:var(--accent);
  border:2px solid var(--bg-1);
  box-shadow:0 2px 8px var(--accent-glow);
  -webkit-appearance:none;appearance:none;
  transition:transform .15s var(--ease);
}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}
input[type=range]::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg-1);
  box-shadow:0 2px 8px var(--accent-glow);cursor:pointer;
}
.batch{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.batch-btn{
  padding:8px 4px;border-radius:var(--radius-sm);
  background:var(--bg-2);border:1px solid var(--border);
  color:var(--text-2);font-size:11px;font-weight:600;
  font-family:'JetBrains Mono',monospace;
  transition:all .15s var(--ease);
}
.batch-btn:hover{border-color:var(--border-strong);color:var(--text)}
.batch-btn.active{
  background:var(--surface-active);
  border-color:var(--border-accent);
  color:var(--accent);
}
.generate-bar{
  position:sticky;bottom:0;
  padding:12px 16px;
  padding-bottom:calc(12px + var(--safe-b));
  background:linear-gradient(to top,var(--bg-1) 60%,transparent);
  border-top:1px solid var(--border);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
}
.btn-generate{
  width:100%;height:48px;
  border-radius:var(--radius);
  background:var(--gradient);
  color:#fff;font-size:14px;font-weight:700;
  letter-spacing:-.01em;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:var(--shadow-accent),inset 0 1px 0 rgba(255,255,255,.2);
  transition:all .2s var(--ease);
  position:relative;overflow:hidden;
}
.btn-generate::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,transparent,rgba(255,255,255,.2),transparent);
  transform:translateX(-100%);
  transition:transform .6s var(--ease);
}
.btn-generate:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 32px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.2)}
.btn-generate:hover:not(:disabled)::before{transform:translateX(100%)}
.btn-generate:active:not(:disabled){transform:translateY(0)}
.btn-generate:disabled{opacity:.6;cursor:not-allowed;box-shadow:0 2px 12px rgba(139,92,246,.15)}
.btn-generate svg{width:17px;height:17px}
.spinner{
  width:16px;height:16px;border-radius:50%;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.canvas{
  display:flex;flex-direction:column;
  min-height:calc(100vh - var(--topbar-h) - var(--safe-t));
  position:relative;
}
.toolbar{
  position:sticky;top:calc(var(--topbar-h) + var(--safe-t));z-index:50;
  padding:12px 20px;
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  flex-wrap:wrap;
}
.toolbar-group{display:flex;align-items:center;gap:8px}
.toolbar-title{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.015em}
.count-badge{
  padding:3px 9px;border-radius:var(--radius-full);
  font-family:'JetBrains Mono',monospace;
  font-size:11px;font-weight:600;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-3);
}
.toolbar-spacer{flex:1}
.tool-btn{
  height:34px;padding:0 12px;
  display:inline-flex;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);
  font-size:12.5px;font-weight:600;
  color:var(--text-2);
  transition:all .15s var(--ease);
}
.tool-btn:hover{background:var(--surface-hover);border-color:var(--border-strong);color:var(--text)}
.tool-btn.active{background:var(--surface-active);border-color:var(--border-accent);color:var(--accent)}
.tool-btn svg{width:14px;height:14px}
.segment{
  display:inline-flex;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:3px;gap:2px;
}
.segment button{
  width:32px;height:28px;border-radius:7px;
  display:grid;place-items:center;
  color:var(--text-3);background:transparent;
  transition:all .15s var(--ease);
}
.segment button:hover{color:var(--text);background:var(--surface-hover)}
.segment button.active{background:var(--bg-4);color:var(--text)}
.segment button svg{width:14px;height:14px}
.search-mini{
  display:flex;align-items:center;gap:8px;
  height:34px;padding:0 10px 0 12px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);
  max-width:220px;
  transition:all .15s var(--ease);
}
.search-mini:focus-within{background:var(--bg-2);border-color:var(--border-accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-mini svg{width:13px;height:13px;color:var(--text-4)}
.search-mini input{
  flex:1;min-width:0;
  font-size:12.5px;color:var(--text);
}

.card{

}
.card:hover .card-actions{opacity:1;transform:none}
.card-btn{
  width:30px;height:30px;border-radius:8px;

  background:rgba(0,0,0,.6);

}
.card-btn:hover{background:rgba(0,0,0,.85);transform:scale(1.08)}

.card-footer{

.card-prompt{

.card-meta{

.skeleton{

.overlay{

.lib-item{

.drawer-empty{

.cmdk{

}

@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.9)}to{opacity:1;transform:none}}

.toast-icon{

}
.toast-icon svg{width:11px;height:11px;color:#fff}

.splash{

}

.splash-bar{

.splash-bar::after{

  animation:splashBar 1.4s ease-in-out infinite;

@media (max-width:900px){

    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  },
};

const $ = (id) => document.getElementById(id);
const $$ = (sel, root = document) => Array.from((root || document).querySelectorAll(sel));

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (k === 'innerHTML') node.innerHTML = v;
    else if (k === 'text') node.textContent = v;
    else if (v !== undefined && v !== null) node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}

function toast(msg, type = 'info') {
  const wrap = $('toasts');
  const icons = { success: ICONS.check, error: ICONS.x, info: ICONS.info };
  const node = el('div', { class: `toast ${type}` }, [
    el('div', { class: 'toast-icon', innerHTML: icons[type] }),
    el('span', { text: msg }),
  ]);
  wrap.appendChild(node);
  setTimeout(() => {
    node.classList.add('out');
    setTimeout(() => node.remove(), 250);
  }, 2600);
}

function updateSlider(input) {
  const valId = input.dataset.slider;
  const isSeed = input.dataset.seed === 'true';
  const v = parseFloat(input.value);
  const d = $(valId);
  if (isSeed) d.textContent = v === -1 ? 'Random' : Math.round(v);
  else d.textContent = Number.isInteger(v) ? v : v.toFixed(1);
  const pct = ((v - +input.min) / (+input.max - +input.min) * 100).toFixed(1);
  input.style.setProperty('--val', pct + '%');
  if (valId === 'stepsVal') state.steps = v;
  if (valId === 'guidanceVal') state.guidance = v;
  if (valId === 'seedVal') state.seed = v;
}

function buildPollinationsUrl(prompt, w, h, model, seed) {
  const enc = encodeURIComponent(prompt);
  return `https://image.pollinations.ai/prompt/${enc}?width=${w}&height=${h}&model=${model}&seed=${seed}&nologo=true&enhance=true`;
}

function loadImage(url, timeout = 60000) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    const timer = setTimeout(() => reject(new Error('Timeout')), timeout);
    img.onload = () => { clearTimeout(timer); resolve(url); };
    img.onerror = () => { clearTimeout(timer); reject(new Error('Load failed')); };
    img.src = url;
  });
}

async function generate() {
  if (state.generating) return;
  const promptText = $('prompt').value.trim();
  if (!promptText) { toast('Enter a prompt first', 'error'); $('prompt').focus(); return; }

  const neg = $('negPrompt').value.trim();
  const ratio = RATIOS.find(r => r.key === state.ratio) || RATIOS[0];

  state.generating = true;
  const btn = $('genBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div><span>Generating…</span>';

  const gallery = $('gallery');
  clearEmptyState();
  const skeletons = [];
  const count = state.batch;
  for (let i = 0; i < count; i++) {
    const sk = el('div', {
      class: 'skeleton',
      style: { aspectRatio: `${ratio.w} / ${ratio.h}` },
    });
    sk.setAttribute('data-model', MODELS.find(m => m.id === state.model)?.label || 'Model');
    gallery.insertBefore(sk, gallery.firstChild);
    skeletons.push(sk);
  }

  const fullPrompt = [promptText, state.style, neg ? `avoid: ${neg}` : '']
    .filter(Boolean).join(', ');

  const tasks = [];
  for (let i = 0; i < count; i++) {
    const seed = state.seed === -1 ? Math.floor(Math.random() * 99999) : state.seed + i;
    const url = buildPollinationsUrl(fullPrompt, ratio.w, ratio.h, state.model, seed);
    tasks.push({ url, seed, skeleton: skeletons[i] });
  }

  let success = 0, failed = 0;
  await Promise.all(tasks.map(async (t) => {
    try {
      await loadImage(t.url);
      t.skeleton.remove();
      const imageObj = {
        id: 'img_' + Math.random().toString(36).slice(2, 11),
        url: t.url,
        prompt: promptText,
        negative: neg,
        style: state.style,
        model: state.model,
        modelLabel: MODELS.find(m => m.id === state.model)?.label || 'Model',
        ratio: state.ratio,
        w: ratio.w,
        h: ratio.h,
        seed: t.seed,
        createdAt: Date.now(),
      };
      state.images.unshift(imageObj);
      gallery.insertBefore(buildCard(imageObj), gallery.firstChild);
      success++;
    } catch {
      t.skeleton.remove();
      failed++;
    }
  }));

  if (success > 0) {
    toast(`${success} image${success > 1 ? 's' : ''} generated`, 'success');
    pushHistory();
  }
  if (failed > 0 && success === 0) toast('Generation failed', 'error');
  if (state.images.length === 0) showEmptyState();
  updateCount();

  state.generating = false;
  btn.disabled = false;
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg><span>Generate</span>';
}

function buildCard(img) {
  const isFav = state.favorites.has(img.id);
  const isSelected = state.selection.has(img.id);
  const card = el('div', {
    class: 'card' + (isSelected ? ' selected' : ''),
    'data-id': img.id,
  });
  card.innerHTML = `
    <img class="card-img" src="${img.url}" alt="" loading="lazy" style="aspect-ratio:${img.w}/${img.h}">
    <div class="card-badge">${img.w}×${img.h}</div>
    <div class="card-actions">
      <button class="card-btn ${isFav ? 'active' : ''}" data-action="fav" title="Favorite">${isFav ? ICONS.heartFill : ICONS.heart}</button>
      <button class="card-btn" data-action="download" title="Download">${ICONS.download}</button>
      <button class="card-btn" data-action="remix" title="Remix">${ICONS.spark}</button>
    </div>
    <div class="card-footer">
      <div class="card-prompt">${escapeHtml(img.prompt)}</div>
      <div class="card-meta">
        <span>${escapeHtml(img.modelLabel)}</span>
        <span>${ICONS.seed} ${img.seed}</span>
      </div>
    </div>`;
  card.addEventListener('click', (e) => {
    const actionBtn = e.target.closest('[data-action]');
    if (actionBtn) {
      e.stopPropagation();
      const action = actionBtn.dataset.action;
      if (action === 'fav') {
        toggleFavorite(img.id);
        actionBtn.classList.toggle('active');
        actionBtn.innerHTML = state.favorites.has(img.id) ? ICONS.heartFill : ICONS.heart;
      } else if (action === 'download') downloadImage(img);
      else if (action === 'remix') remixImage(img);
      return;
    }
    if (state.selectMode) { toggleSelect(img.id); return; }
    openLightbox(img.id);
  });
  return card;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function rebuildGallery() {
  const gallery = $('gallery');
  const filtered = state.images.filter(img => {
    if (!state.search) return true;
    const q = state.search.toLowerCase();
    return img.prompt.toLowerCase().includes(q) || img.modelLabel.toLowerCase().includes(q);
  });
  gallery.innerHTML = '';
  if (!filtered.length) { showEmptyState(); updateCount(); return; }
  filtered.forEach(img => gallery.appendChild(buildCard(img)));
  updateCount();
}

function updateCount() {
  $('countBadge').textContent = state.images.length;
  $('selCount').textContent = state.selection.size;
}

function showEmptyState() {
  const g = $('gallery');
  if (g.querySelector('.empty')) return;
  g.innerHTML = `
    <div class="empty">
      <img class="empty-logo" src="${LOGO_SRC}" alt="">
      <h3>No images yet</h3>
      <p>Write a prompt and click <kbd>Generate</kbd> to create your first image. Try the <kbd>⌘K</kbd> command palette for shortcuts.</p>
    </div>`;
}

function clearEmptyState() {
  const e = $('gallery').querySelector('.empty');
  if (e) e.remove();
}

function toggleFavorite(id) {
  if (state.favorites.has(id)) {
    state.favorites.delete(id);
    toast('Removed from favorites', 'info');
  } else {
    state.favorites.add(id);
    toast('Added to favorites', 'success');
  }
  storage.set(CONFIG.storageKeys.favorites, Array.from(state.favorites));
}

async function downloadImage(img) {
  try {
    const res = await fetch(img.url);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `ai-${img.prompt.slice(0, 30).replace(/\s+/g, '-')}-${img.seed}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Download started', 'success');
  } catch {
    window.open(img.url, '_blank');
    toast('Opened in new tab', 'info');
  }
}

function remixImage(img) {
  $('prompt').value = img.prompt;
  $('negPrompt').value = img.negative || '';
  state.style = img.style || '';
  state.model = img.model;
  state.ratio = img.ratio;
  $$('.chip').forEach(c => c.classList.toggle('active', c.dataset.style === state.style));
  $$('.model').forEach(m => m.classList.toggle('active', m.dataset.model === state.model));
  $$('.ratio').forEach(r => r.classList.toggle('active', r.dataset.ratio === state.ratio));
  updateCharCount();
  closeLightbox();
  if (window.innerWidth <= 900) closeMobileSidebar();
  toast('Prompt loaded into editor', 'success');
}

function toggleSelectMode() {
  state.selectMode = !state.selectMode;
  $('selectModeBtn').classList.toggle('active', state.selectMode);
  $('selectionBar').classList.toggle('show', state.selectMode);
  if (!state.selectMode) {
    state.selection.clear();
    $$('.card').forEach(c => c.classList.remove('selected'));
    updateCount();
  }
}

function toggleSelect(id) {
  if (state.selection.has(id)) state.selection.delete(id);
  else state.selection.add(id);
  const card = $(`.card[data-id="${id}"]`);
  if (card) card.classList.toggle('selected', state.selection.has(id));
  updateCount();
}

async function downloadSelected() {
  const selected = state.images.filter(i => state.selection.has(i.id));
  if (!selected.length) return;
  toast(`Downloading ${selected.length}…`, 'info');
  for (const img of selected) await downloadImage(img);
}

function favoriteSelected() {
  state.images.filter(i => state.selection.has(i.id)).forEach(img => state.favorites.add(img.id));
  storage.set(CONFIG.storageKeys.favorites, Array.from(state.favorites));
  toast('Favorites updated', 'success');
  rebuildGallery();
}

function deleteSelected() {
  const ids = Array.from(state.selection);
  state.images = state.images.filter(i => !ids.includes(i.id));
  ids.forEach(id => state.favorites.delete(id));
  state.selection.clear();
  storage.set(CONFIG.storageKeys.favorites, Array.from(state.favorites));
  toggleSelectMode();
  rebuildGallery();
  toast(`${ids.length} removed`, 'success');
}

function openLightbox(id) {
  const img = state.images.find(i => i.id === id);
  if (!img) return;
  state.activeLightbox = img;
  $('lightboxImg').src = img.url;
  $('lightboxPrompt').textContent = img.prompt;
  const isFav = state.favorites.has(id);
  $('lbFav').innerHTML = isFav ? ICONS.heartFill : ICONS.heart;
  $('lbFav').classList.toggle('btn-soft', isFav);
  $('lightboxChips').innerHTML = `
    <span class="lightbox-chip">${ICONS.seed} ${img.seed}</span>
    <span class="lightbox-chip">${escapeHtml(img.modelLabel)}</span>
    <span class="lightbox-chip">${img.w}×${img.h}</span>
    ${img.style ? `<span class="lightbox-chip">${escapeHtml(img.style)}</span>` : ''}`;
  $('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  $('lightbox').classList.remove('open');
  $('lightboxMedia').classList.remove('zoomed');
  document.body.style.overflow = '';
  state.activeLightbox = null;
}

function openLibrary() { openDrawer('libraryDrawer'); renderLibrary(); }
function openHistory() { openDrawer('historyDrawer'); renderHistory(); }

function saveCurrentPreset() {
  const prompt = $('prompt').value.trim();
  if (!prompt) { toast('Enter a prompt to save', 'error'); return; }
  const name = window.prompt('Preset name:', prompt.slice(0, 40));
  if (!name) return;
  const preset = {
    id: 'p_' + Date.now(),
    name,
    prompt,
    negative: $('negPrompt').value.trim(),
    style: state.style,
    model: state.model,
    ratio: state.ratio,
    createdAt: Date.now(),
  };
  state.library.unshift(preset);
  storage.set(CONFIG.storageKeys.library, state.library);
  renderLibrary();
  toast('Preset saved', 'success');
}

function renderLibrary() {
  const list = $('libraryList');
  if (!state.library.length) {
    list.innerHTML = `<div class="drawer-empty">
      <img class="drawer-empty-logo" src="${LOGO_SRC}" alt="">
      <h3>No presets yet</h3>
      <p>Save prompts you love to reuse them instantly.</p>
    </div>`;
    return;
  }
  list.innerHTML = '';
  state.library.forEach(p => {
    const item = el('div', { class: 'lib-item' });
    item.innerHTML = `
      <div class="lib-info">
        <div class="lib-name">${escapeHtml(p.name)}</div>
        <div class="lib-prompt">${escapeHtml(p.prompt)}</div>
        <div class="lib-meta">
          <span class="lib-tag">${escapeHtml(MODELS.find(m => m.id === p.model)?.label || 'Model')}</span>
          <span class="lib-tag">${escapeHtml(RATIOS.find(r => r.key === p.ratio)?.label || '1:1')}</span>
        </div>
      </div>
      <div class="lib-actions">
        <button class="card-btn" data-act="use" title="Load">${ICONS.check}</button>
        <button class="card-btn" data-act="delete" title="Delete">${ICONS.x}</button>
      </div>`;
    item.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act]');
      if (!btn) { loadPreset(p); return; }
      if (btn.dataset.act === 'use') loadPreset(p);
      if (btn.dataset.act === 'delete') {
        state.library = state.library.filter(x => x.id !== p.id);
        storage.set(CONFIG.storageKeys.library, state.library);
        renderLibrary();
        toast('Preset removed', 'info');
      }
    });
    list.appendChild(item);
  });
}

function loadPreset(p) {
  $('prompt').value = p.prompt;
  $('negPrompt').value = p.negative || '';
  state.style = p.style || '';
  state.model = p.model;
  state.ratio = p.ratio;
  $$('.chip').forEach(c => c.classList.toggle('active', c.dataset.style === state.style));
  $$('.model').forEach(m => m.classList.toggle('active', m.dataset.model === state.model));
  $$('.ratio').forEach(r => r.classList.toggle('active', r.dataset.ratio === state.ratio));
  updateCharCount();
  closeDrawer();
  toast('Preset loaded', 'success');
}

function pushHistory() {
  const recent = state.images.slice(0, 6).map(i => ({
    id: i.id, url: i.url, prompt: i.prompt, modelLabel: i.modelLabel, createdAt: i.createdAt,
  }));
  state.history = recent;
  storage.set(CONFIG.storageKeys.history, state.history);
}

function renderHistory() {
  const list = $('historyList');
  if (!state.history.length) {
    list.innerHTML = `<div class="drawer-empty">
      <img class="drawer-empty-logo" src="${LOGO_SRC}" alt="">
      <h3>No history</h3>
      <p>Your recent generations will appear here.</p>
    </div>`;
    return;
  }
  list.innerHTML = '';
  state.history.forEach(h => {
    const item = el('div', { class: 'hist-item' });
    const t = new Date(h.createdAt);
    const timeStr = t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    item.innerHTML = `
      <img class="hist-thumb" src="${h.url}" alt="">
      <div class="hist-info">
        <div class="hist-prompt">${escapeHtml(h.prompt)}</div>
        <div class="hist-time">${timeStr} · ${escapeHtml(h.modelLabel)}</div>
      </div>`;
    item.addEventListener('click', () => {
      const exists = state.images.find(i => i.id === h.id);
      if (exists) { closeDrawer(); setTimeout(() => openLightbox(h.id), 300); }
      else toast('Image not in current session', 'info');
    });
    list.appendChild(item);
  });
}

function openDrawer(id) {
  closeDrawer();
  $(id).classList.add('open');
  $('overlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeDrawer() {
  $$('.drawer').forEach(d => d.classList.remove('open'));
  $('overlay').classList.remove('show');
  document.body.style.overflow = '';
}

const COMMANDS = [
  { icon: ICONS.spark, label: 'Generate image', desc: 'Run generation with current settings', keys: ['⌘', '↵'], fn: () => generate() },
  { icon: ICONS.shuffle, label: 'Random prompt', desc: 'Roll a random inspiration', fn: randomPrompt },
  { icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>', label: 'Toggle sidebar', desc: 'Collapse or expand', keys: ['⌘', 'B'], fn: toggleSidebar },
  { icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>', label: 'Open prompt library', desc: 'Saved presets', keys: ['⌘', 'L'], fn: openLibrary },
  { icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>', label: 'Open history', desc: 'Recent generations', keys: ['⌘', 'H'], fn: openHistory },
  { icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>', label: 'Toggle theme', desc: 'Light or dark mode', keys: ['⌘', 'J'], fn: () => applyTheme(state.theme === 'dark' ? 'light' : 'dark') },
  { icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>', label: 'Toggle select mode', desc: 'Batch select images', fn: toggleSelectMode },
  { icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>', label: 'Clear all images', desc: 'Remove gallery', keys: ['⌘', '⇧', 'C'], fn: clearAll },
  { icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>', label: 'Show shortcuts', desc: 'Keyboard reference', keys: ['?'], fn: () => openShortcuts() },
  ...MODELS.map(m => ({
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
    label: `Switch model: ${m.label}`,
    desc: m.desc,
    fn: () => {
      state.model = m.id;
      $$('.model').forEach(x => x.classList.toggle('active', x.dataset.model === m.id));
      toast(`Model: ${m.label}`, 'success');
    },
  })),
  ...RATIOS.map(r => ({
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>',
    label: `Set ratio: ${r.label}`,
    desc: `${r.w}×${r.h}`,
    fn: () => {
      state.ratio = r.key;
      $$('.ratio').forEach(x => x.classList.toggle('active', x.dataset.ratio === r.key));
      toast(`Ratio: ${r.label}`, 'success');
    },
  })),
];

function openCmdk() {
  $('cmdk').classList.add('open');
  $('cmdkInput').value = '';
  $('cmdkInput').focus();
  renderCmdk('');
}

function closeCmdk() {
  $('cmdk').classList.remove('open');
}

function renderCmdk(query) {
  const q = query.trim().toLowerCase();
  const filtered = q
    ? COMMANDS.filter(c => c.label.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q))
    : COMMANDS;
  state.cmdkItems = filtered;
  state.cmdkIndex = 0;
  const body = $('cmdkBody');
  if (!filtered.length) {
    body.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-3);font-size:13px">No commands match "${escapeHtml(q)}"</div>`;
    return;
  }
  body.innerHTML = '<div class="cmdk-group-label">Commands</div>';
  filtered.forEach((c, i) => {
    const item = el('button', { class: 'cmdk-item' + (i === 0 ? ' active' : ''), 'data-idx': i });
    item.innerHTML = `
      <div class="cmdk-ico">${c.icon}</div>
      <div class="cmdk-text">
        <div class="cmdk-label">${escapeHtml(c.label)}</div>
        <div class="cmdk-desc">${escapeHtml(c.desc)}</div>
      </div>
      ${c.keys ? `<div class="shortcut-keys">${c.keys.map(k => `<kbd>${k}</kbd>`).join('')}</div>` : ''}`;
    item.addEventListener('click', () => { closeCmdk(); c.fn(); });
    item.addEventListener('mouseenter', () => setCmdkIndex(i));
    body.appendChild(item);
  });
}

function setCmdkIndex(i) {
  if (i < 0 || i >= state.cmdkItems.length) return;
  state.cmdkIndex = i;
  $$('.cmdk-item').forEach((node, n) => node.classList.toggle('active', n === i));
  const active = $$('.cmdk-item')[i];
  if (active) active.scrollIntoView({ block: 'nearest' });
}

function openShortcuts() { $('shortcuts').classList.add('open'); }
function closeShortcuts() { $('shortcuts').classList.remove('open'); }

function clearAll() {
  if (!state.images.length) { toast('Nothing to clear', 'info'); return; }
  state.images = [];
  state.selection.clear();
  state.favorites.clear();
  rebuildGallery();
  storage.set(CONFIG.storageKeys.favorites, []);
  toast('Gallery cleared', 'success');
}

function setLayout(mode) {
  state.layout = mode;
  const g = $('gallery');
  g.className = 'gallery' + (mode === 'compact' ? ' layout-compact' : mode === 'large' ? ' layout-large' : '');
  $$('#layoutSeg button').forEach(b => b.classList.toggle('active', b.dataset.layout === mode));
}

function initKeyboard() {
  const mod = navigator.platform.toUpperCase().includes('MAC') ? '⌘' : 'Ctrl';
  $('modKey').textContent = mod;

  document.addEventListener('keydown', (e) => {
    const isInput = ['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName);
    const cmd = e.metaKey || e.ctrlKey;

    if (cmd && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      $('cmdk').classList.contains('open') ? closeCmdk() : openCmdk();
      return;
    }
    if (cmd && e.key === 'Enter') {
      e.preventDefault();
      generate();
      return;
    }
    if (cmd && e.key.toLowerCase() === 'b') {
      e.preventDefault();
      toggleSidebar();
      return;
    }
    if (cmd && e.key.toLowerCase() === 'l') {
      e.preventDefault();
      $('libraryDrawer').classList.contains('open') ? closeDrawer() : openLibrary();
      return;
    }
    if (cmd && e.key.toLowerCase() === 'h') {
      e.preventDefault();
      $('historyDrawer').classList.contains('open') ? closeDrawer() : openHistory();
      return;
    }
    if (cmd && e.key.toLowerCase() === 'j') {
      e.preventDefault();
      applyTheme(state.theme === 'dark' ? 'light' : 'dark');
      return;
    }
    if (cmd && e.shiftKey && e.key.toLowerCase() === 'c') {
      e.preventDefault();
      clearAll();
      return;
    }

    if (isInput) return;

    if (e.key === 'Escape') {
      if ($('cmdk').classList.contains('open')) { closeCmdk(); return; }
      if ($('shortcuts').classList.contains('open')) { closeShortcuts(); return; }
      if ($('lightbox').classList.contains('open')) { closeLightbox(); return; }
      if ($('overlay').classList.contains('show')) { closeDrawer(); return; }
      if (state.mobileSidebar === 'open') { closeMobileSidebar(); return; }
      if (state.selectMode) { toggleSelectMode(); return; }
    }
    if (e.key === '?') { e.preventDefault(); openShortcuts(); return; }
    if (e.key === '/') { e.preventDefault(); $('searchInput')?.focus(); return; }
  });
}

function wireEvents() {
  document.addEventListener('click', (e) => {
    const head = e.target.closest('[data-toggle="section"]');
    if (head) head.closest('.section').classList.toggle('collapsed');
  });

  $('prompt').addEventListener('input', updateCharCount);
  $('diceBtn').addEventListener('click', randomPrompt);
  $('clearPromptBtn').addEventListener('click', () => { $('prompt').value = ''; updateCharCount(); });

  $$('input[type="range"]').forEach(input => {
    input.addEventListener('input', () => updateSlider(input));
  });

  $('genBtn').addEventListener('click', generate);
  $('themeBtn').addEventListener('click', () => applyTheme(state.theme === 'dark' ? 'light' : 'dark'));
  $('cmdTrigger').addEventListener('click', openCmdk);
  $('libraryBtn').addEventListener('click', openLibrary);
  $('historyBtn').addEventListener('click', openHistory);
  $('shortcutsBtn').addEventListener('click', openShortcuts);
  $('mobileSidebarBtn').addEventListener('click', () => {
    state.mobileSidebar === 'open' ? closeMobileSidebar() : openMobileSidebar();
  });

  $('overlay').addEventListener('click', () => { closeDrawer(); closeMobileSidebar(); });
  $$('[data-close-drawer]').forEach(b => b.addEventListener('click', closeDrawer));

  $('selectModeBtn').addEventListener('click', toggleSelectMode);
  $('selCancelBtn').addEventListener('click', toggleSelectMode);
  $('selDownloadBtn').addEventListener('click', downloadSelected);
  $('selFavBtn').addEventListener('click', favoriteSelected);
  $('selDeleteBtn').addEventListener('click', deleteSelected);

  $('searchInput').addEventListener('input', (e) => { state.search = e.target.value; rebuildGallery(); });

  $$('#layoutSeg button').forEach(b => {
    b.addEventListener('click', () => setLayout(b.dataset.layout));
  });

  $('savePresetBtn').addEventListener('click', saveCurrentPreset);
  $('clearHistoryBtn').addEventListener('click', () => {
    state.history = [];
    storage.set(CONFIG.storageKeys.history, []);
    renderHistory();
    toast('History cleared', 'info');
  });

  $('lightboxClose').addEventListener('click', closeLightbox);
  $('lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') closeLightbox(); });
  $('lbDownload').addEventListener('click', () => { if (state.activeLightbox) downloadImage(state.activeLightbox); });
  $('lbRemix').addEventListener('click', () => { if (state.activeLightbox) remixImage(state.activeLightbox); });
  $('lbCopyPrompt').addEventListener('click', () => {
    if (!state.activeLightbox) return;
    navigator.clipboard.writeText(state.activeLightbox.prompt);
    toast('Prompt copied', 'success');
  });
  $('lbVariation').addEventListener('click', () => {
    const img = state.activeLightbox;
    if (!img) return;
    closeLightbox();
    remixImage(img);
    state.seed = Math.floor(Math.random() * 99999);
    updateSlider($('seed'));
    setTimeout(generate, 100);
  });
  $('lbFav').addEventListener('click', () => {
    if (!state.activeLightbox) return;
    toggleFavorite(state.activeLightbox.id);
    const isFav = state.favorites.has(state.activeLightbox.id);
    $('lbFav').innerHTML = isFav ? ICONS.heartFill : ICONS.heart;
    $('lbFav').classList.toggle('btn-soft', isFav);
  });
  $('lightboxMedia').addEventListener('click', (e) => {
    if (e.target.id === 'lightboxMedia' || e.target.tagName === 'IMG') {
      $('lightboxMedia').classList.toggle('zoomed');
    }
  });

  $('shortcutsClose').addEventListener('click', closeShortcuts);
  $('shortcuts').addEventListener('click', (e) => { if (e.target.id === 'shortcuts') closeShortcuts(); });

  $('cmdk').addEventListener('click', (e) => { if (e.target.id === 'cmdk') closeCmdk(); });
  $('cmdkInput').addEventListener('input', (e) => renderCmdk(e.target.value));
  $('cmdkInput').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setCmdkIndex(Math.min(state.cmdkIndex + 1, state.cmdkItems.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setCmdkIndex(Math.max(state.cmdkIndex - 1, 0)); }
    else if (e.key === 'Enter') { e.preventDefault(); const c = state.cmdkItems[state.cmdkIndex]; if (c) { closeCmdk(); c.fn(); } }
    else if (e.key === 'Escape') { closeCmdk(); }
  });
}

function init() {
  const savedTheme = storage.get(CONFIG.storageKeys.theme, null);
  state.theme = savedTheme || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  const prefs = storage.get(CONFIG.storageKeys.prefs, {});
  if (prefs.sidebar) state.sidebar = prefs.sidebar;
  state.library = storage.get(CONFIG.storageKeys.library, []);
  state.history = storage.get(CONFIG.storageKeys.history, []);
  state.favorites = new Set(storage.get(CONFIG.storageKeys.favorites, []));

  applyTheme(state.theme);
  document.body.setAttribute('data-sidebar', state.sidebar);

  buildStyles();
  buildModels();
  buildRatios();
  buildBatch();
  buildSuggestions();
  buildShortcuts();
  ['steps', 'guidance', 'seed'].forEach(id => updateSlider($(id)));

  wireEvents();
  initKeyboard();
  showEmptyState();
  updateCount();

  if (window.innerWidth <= 900) state.mobileSidebar = 'closed';
  setTimeout(() => $('splash').classList.add('hide'), 800);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
